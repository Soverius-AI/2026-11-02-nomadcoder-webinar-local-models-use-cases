name: hands-on-local-rag
services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg17
    environment:
      POSTGRES_DB: raglab
      POSTGRES_USER: lab_admin
      POSTGRES_PASSWORD: local-workshop-admin
    ports: ["127.0.0.1:5437:5432"]
    volumes: ["rag-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab_admin -d raglab"]
      interval: 3s
      timeout: 3s
      retries: 20
  explorer:
    image: hands-on-local-rag-explorer:local
    build: {context: ., dockerfile: explorer/Dockerfile}
    ports: ["127.0.0.1:4342:4341"]
    environment: &lab-env
      PORT: 4341
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: raglab
      ADMIN_PASSWORD: local-workshop-admin
      PUBLIC_ORIGIN: http://localhost:4342
      WORKSHOP_PASSWORD: ${WORKSHOP_PASSWORD:-workshop}
      EMBED_BASE_URL: ${EMBED_BASE_URL:-http://host.docker.internal:8080/v1}
      EMBED_MODEL: ${EMBED_MODEL:-workshop-embed}
      EMBED_SPACE_ID: ${EMBED_SPACE_ID:-workshop-embed-v1}
      DOCUMENT_PREFIX: "${DOCUMENT_PREFIX:-title: none | text: }"
      QUERY_PREFIX: "${QUERY_PREFIX:-task: search result | query: }"
      CHAT_BASE_URL: ${CHAT_BASE_URL:-http://host.docker.internal:8080/v1}
      CHAT_MODEL: ${CHAT_MODEL:-Gemma}
      RERANK_BASE_URL: ${RERANK_BASE_URL:-http://host.docker.internal:8082/v1}
      RERANK_MODEL: ${RERANK_MODEL:-workshop-rerank}
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["./corpus/reference-documents:/pdfs:ro"]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4341/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
  lab:
    image: hands-on-local-rag-explorer:local
    build: {context: ., dockerfile: explorer/Dockerfile}
    profiles: ["tools"]
    environment: *lab-env
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["./corpus/reference-documents:/pdfs:ro", "./output:/app/output", "./explorer/scripts:/app/scripts:ro", "./explorer/lib:/app/lib:ro"]
    entrypoint: ["node", "scripts/lab.mjs"]
    depends_on:
      explorer: {condition: service_healthy}
volumes:
  rag-data:

networks:
  default:
    ipam:
      config:
        - subnet: ${RAG_LAB_SUBNET:-10.203.45.0/24}
